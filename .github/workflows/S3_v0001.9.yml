name: Build S3_v0001.9 APK

on:
  push:
    branches:
      - hevel/S3_v0001.9-skin-alt-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack app
        run: |
          unzip -q S3_v0001.9.zip
          ls -la S3_v0001.9

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run app checks
        working-directory: S3_v0001.9
        run: |
          python3 tools/repository_contract_test.py
          python3 tools/ui_contract_test.py
          python3 tools/compat_contract_test.py

      - name: Build APK
        working-directory: S3_v0001.9
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          cp S3_v0001.9/app/build/outputs/apk/debug/app-debug.apk \
             S3_v0001.9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3_v0001.9
          path: S3_v0001.9.apk
