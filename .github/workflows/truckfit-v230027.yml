name: Build TruckFit v230027 APK
on:
  workflow_dispatch:
  push:
    branches: [truckfit/v230027-mapscan]
    paths:
      - 'TruckFit_v230027_MAPSCAN_RASTER_ORDER_SOURCE_UNCOMPILED.zip'
      - '.github/workflows/truckfit-v230027.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unpack TruckFit v230027
        run: |
          test -f TruckFit_v230027_MAPSCAN_RASTER_ORDER_SOURCE_UNCOMPILED.zip
          unzip -q TruckFit_v230027_MAPSCAN_RASTER_ORDER_SOURCE_UNCOMPILED.zip -d extracted
          test -f extracted/android/TruckFitRecovered/app/build.gradle.kts
          sed -i 's/versionCode = 230025/versionCode = 230027/;s/versionName = "23.0.25-auto-trim-center"/versionName = "23.0.27-mapscan-raster-order"/' extracted/android/TruckFitRecovered/app/build.gradle.kts
      - name: Build debug APK
        working-directory: extracted/android/TruckFitRecovered
        run: |
          gradle --version || true
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckFit-v230027-debug-APK
          path: extracted/android/TruckFitRecovered/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
